<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DO me love u? 💙</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: #fce4ec;
            background-image: radial-gradient(circle at 20% 20%, #f8bbd0 0%, transparent 40%), radial-gradient(circle at 80% 80%, #e1f5fe 0%, transparent 40%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .heart-float {
            position: absolute;
            font-size: clamp(14px, 2.5vw, 22px);
            animation: floatHeart linear infinite;
            opacity: 0;
        }
        
        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: clamp(28px, 5vw, 52px) clamp(32px, 6vw, 68px);
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.15), 0 4px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(14px, 2.5vw, 24px);
            max-width: 500px;
            width: 90vw;
        }
        
        .capoo-wrap {
            position: relative;
            width: clamp(180px, 36vw, 250px);
            height: clamp(180px, 36vw, 250px);
            border-radius: 20px;
            overflow: hidden;
        }
        
        .capoo-gif {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.35s ease;
        }
        
        #capoo-normal {
            opacity: 1;
        }
        
        #capoo-happy {
            opacity: 0;
        }
        
        .capoo-wrap.show-happy #capoo-normal {
            opacity: 0;
        }
        
        .capoo-wrap.show-happy #capoo-happy {
            opacity: 1;
        }
        
        .capoo-wrap.pop {
            animation: capooPop 0.5s cubic-bezier(.34, 1.56, .64, 1);
        }
        
        .capoo-wrap.shake {
            animation: capooShake 0.45s ease-in-out;
        }
        
        @keyframes capooPop {
            0% {
                transform: scale(0.85) rotate(-4deg);
            }
            55% {
                transform: scale(1.16) rotate(3deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }
        
        @keyframes capooShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-9px) rotate(-3deg);
            }
            50% {
                transform: translateX(9px) rotate(3deg);
            }
            75% {
                transform: translateX(-5px);
            }
        }
        
        .question {
            font-size: clamp(22px, 4.5vw, 36px);
            font-weight: 900;
            color: #d81b60;
            text-align: center;
            line-height: 1.2;
        }
        
        .question span {
            color: #42a5f5;
        }
        
        .sub-text {
            font-size: clamp(18px, 3vw, 24px);
            /* Adjust font size */
            color: #f48fb1;
            /* Keep the pink color */
            font-weight: 900;
            /* Make the text bold */
            text-align: center;
            min-height: 22px;
            transition: opacity 0.3s;
            margin-bottom: 20px;
            /* Add margin to push the yes-msg higher */
        }
        
        .yes-msg {
            font-size: clamp(18px, 3.5vw, 26px);
            color: #d81b60;
            font-weight: 900;
            text-align: center;
            display: none;
            animation: popIn 0.5s cubic-bezier(.34, 1.56, .64, 1);
            margin-top: -20px;
            /* Move the message higher */
        }
        
        @keyframes popIn {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        
        .buttons {
            display: flex;
            gap: clamp(14px, 3vw, 24px);
            align-items: center;
            position: relative;
            min-height: 72px;
            width: 100%;
            justify-content: center;
        }
        
        .btn {
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            cursor: pointer;
            padding: 0.6em 2em;
            /* Ensure consistent padding */
            white-space: nowrap;
            font-size: clamp(16px, 3vw, 22px);
            /* Ensure consistent font size */
            transition: transform 0.15s ease, box-shadow 0.15s ease, font-size 0.4s cubic-bezier(.34, 1.56, .64, 1), background 0.2s;
            width: 150px;
            /* Set fixed width for consistency */
            height: 50px;
            /* Set fixed height for consistency */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn:active {
            transform: scale(0.92) !important;
        }
        
        #yes-btn {
            background: white;
            color: #4caf50;
            /* Green color */
            border: 2.5px solid #66bb6a;
            box-shadow: 0 4px 16px rgba(76, 175, 80, 0.15);
        }
        
        #yes-btn:hover {
            transform: scale(1.07);
            background: #e8f5e9;
            box-shadow: 0 8px 24px rgba(76, 175, 80, 0.25);
        }
        
        #no-btn {
            background: white;
            color: #f44336;
            /* Red color */
            border: 2.5px solid #ef5350;
            box-shadow: 0 4px 16px rgba(244, 67, 54, 0.15);
            transition: left 0.05s, top 0.05s, font-size 0.4s cubic-bezier(.34, 1.56, .64, 1), opacity 0.3s, background 0.2s;
            z-index: 20;
        }
        
        #no-btn.placed {
            position: fixed;
        }
        
        #no-btn:hover {
            transform: scale(1.05);
            background: #ffebee;
        }
        
        .confetti-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .confetti-piece {
            position: absolute;
            animation: confettiFall 1.5s ease-in forwards;
        }
        
        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(80vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
                border-radius: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="hearts-bg" id="heartsBg"></div>
    <div class="confetti-area" id="confettiArea"></div>

    <div class="card">
        <div class="capoo-wrap" id="capooWrap">
            <!-- Updated GIF URLs -->
            <img id="capoo-normal" class="capoo-gif" src="https://media.giphy.com/media/yPAWyc35MhDUNrzySi/giphy.gif" alt="Capoo">
            <img id="capoo-happy" class="capoo-gif" src="https://media.giphy.com/media/754u3UNlbbc2tMg97K/giphy.gif" alt="Capoo happy">
        </div>

        <div class="question">DO <span>me</span> love u?</div>
        <div class="sub-text" id="subText">OwO what's this feeling...</div>
        <div class="yes-msg" id="yesMsg">YAY!! Capoo is so happy!! 🎉</div>

        <div class="buttons">
            <button class="btn" id="yes-btn" onclick="handleYes()">YES</button>
            <button class="btn" id="no-btn" onclick="handleNo()">No</button>
        </div>
    </div>

    <script>
        let noCount = 0,
            placed = false;
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const subText = document.getElementById('subText');
        const yesMsg = document.getElementById('yesMsg');
        const capooWrap = document.getElementById('capooWrap');
        const confettiArea = document.getElementById('confettiArea');

        const noTexts = [
            "OwO what's this feeling...",
            "Are you suuure...?? 🥺",
            "Capoo is sad now... 😢",
            "Please just say yes!! 🥺💙",
            "Capoo is crying!!! 😭",
            "Nooooo come back!!! 💔",
            "You're being so mean... 😿",
            "JUST SAY YES ALREADY!! 😤",
            "Capoo will find you... 👀",
            "OK fine... but capoo is pouting 🫣"
        ];

        function getYesFontSize() {
            const base = window.innerWidth < 480 ? 18 : 26;
            return Math.min(base + noCount * 6, 72);
        }

        function getNoFontSize() {
            const base = window.innerWidth < 480 ? 14 : 20;
            return Math.max(9, base - noCount * 1.5);
        }

        function placeNoBtn() {
            if (!placed) {
                const r = noBtn.getBoundingClientRect();
                noBtn.style.left = r.left + 'px';
                noBtn.style.top = r.top + 'px';
                noBtn.classList.add('placed');
                placed = true;
            }
        }

        function moveNoBtn() {
            const w = window.innerWidth,
                h = window.innerHeight;
            const bw = noBtn.offsetWidth,
                bh = noBtn.offsetHeight,
                m = 16;
            let nx, ny, tries = 0;
            do {
                nx = m + Math.random() * (w - bw - m * 2);
                ny = m + Math.random() * (h - bh - m * 2);
            } while (++tries < 30 && isOverCard(nx, ny, bw, bh));
            noBtn.style.left = nx + 'px';
            noBtn.style.top = ny + 'px';
        }

        function isOverCard(x, y, bw, bh) {
            const r = document.querySelector('.card').getBoundingClientRect();
            return !(x + bw < r.left - 20 || x > r.right + 20 || y + bh < r.top - 20 || y > r.bottom + 20);
        }

        function triggerAnim(cls, ms) {
            capooWrap.classList.remove('pop', 'shake');
            void capooWrap.offsetWidth;
            capooWrap.classList.add(cls);
            setTimeout(() => capooWrap.classList.remove(cls), ms);
        }

        function handleNo() {
            noCount++;
            placeNoBtn();
            moveNoBtn();
            yesBtn.style.fontSize = getYesFontSize() + 'px';
            noBtn.style.fontSize = getNoFontSize() + 'px';
            subText.textContent = noTexts[Math.min(noCount - 1, noTexts.length - 1)];
            subText.style.opacity = 1;
            triggerAnim('shake', 500);
            if (noCount >= 5) noBtn.style.opacity = String(Math.max(0.3, 1 - (noCount - 4) * 0.12));
        }

        function handleYes() {
            capooWrap.classList.add('show-happy');
            triggerAnim('pop', 600);
            subText.textContent = "YAY!! Capoo is so happy!! 🎉"; // Replace sub-text with the happy message
            subText.style.color = "#d81b60"; // Change color to match the happy message
            subText.style.fontWeight = "900"; // Make it bold
            subText.style.fontSize = "clamp(18px, 3.5vw, 26px)"; // Adjust font size
            subText.style.opacity = 1; // Ensure visibility
            yesMsg.style.display = 'none'; // Hide the original yes message
            launchConfetti();
            setTimeout(resetAll, 2800);
        }

        function resetAll() {
            noCount = 0;
            placed = false;
            yesBtn.style.fontSize = '';
            noBtn.style.fontSize = '';
            noBtn.style.opacity = '';
            noBtn.style.left = '';
            noBtn.style.top = '';
            noBtn.classList.remove('placed');
            yesMsg.style.display = 'none';
            subText.textContent = noTexts[0];
            subText.style.opacity = 1;
            capooWrap.classList.remove('show-happy', 'pop', 'shake');
            confettiArea.innerHTML = '';
        }

        function launchConfetti() {
            const colors = ['#e91e8c', '#42a5f5', '#ffd54f', '#66bb6a', '#ef5350', '#ce93d8', '#80deea'];
            confettiArea.innerHTML = '';
            for (let i = 0; i < 70; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                el.style.cssText = `
        left:${5+Math.random()*90}vw; top:-20px;
        width:${6+Math.random()*10}px; height:${6+Math.random()*10}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        border-radius:${Math.random()>.5?'50%':'3px'};
        animation-delay:${Math.random()*.9}s;
        animation-duration:${1+Math.random()*.8}s;
      `;
                confettiArea.appendChild(el);
            }
        }

        (function spawnHearts() {
            const bg = document.getElementById('heartsBg');
            const emojis = ['💙', '🩵', '💖', '💕', '🫧', '⭐'];
            for (let i = 0; i < 14; i++) {
                const h = document.createElement('div');
                h.className = 'heart-float';
                h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                h.style.left = (Math.random() * 95) + 'vw';
                h.style.animationDuration = (6 + Math.random() * 8) + 's';
                h.style.animationDelay = (Math.random() * 10) + 's';
                bg.appendChild(h);
            }
        })();
    </script>
</body>

</html>
